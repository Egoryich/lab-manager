[project]
name = "lab-node-agent"
version = "0.4.0"
description = "Lab Manager node inventory and Proxmox adapter"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
lab-node-agent = "lab_node_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "cryptography>=44"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
