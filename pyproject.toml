[project]
name = "lab-manager"
version = "0.1.0"
description = "Lab Manager control plane"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2", "pydantic-settings>=2.8,<3",
  "pwdlib[argon2]>=0.2,<1", "cryptography>=44", "redis>=5,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/lab_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires dedicated PostgreSQL and Redis"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

