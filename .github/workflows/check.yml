name: Lab Manager checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.9.8
      - run: uv sync --project apps/node-agent --locked
      - run: uv run --project apps/node-agent ruff check apps/node-agent
      - run: uv run --project apps/node-agent ruff format --check apps/node-agent
      - run: uv run --project apps/node-agent pytest apps/node-agent/tests -c apps/node-agent/pyproject.toml -q
      - run: uv build --project apps/node-agent --wheel --out-dir artifacts/node-agent
      - name: Check standalone installation
        run: |
          python -m venv /tmp/lab-agent-package-test
          /tmp/lab-agent-package-test/bin/pip install --no-deps artifacts/node-agent/*.whl
          /tmp/lab-agent-package-test/bin/lab-node-agent --help
          /tmp/lab-agent-package-test/bin/python -m lab_node_agent.service --help
          cp infra/proxmox/lab-node-agent.service tools/node-pki.py artifacts/node-agent/
          cd artifacts/node-agent
          sha256sum *.whl *.service *.py > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: node-agent-${{ github.sha }}
          path: artifacts/node-agent/
          if-no-files-found: error
  node-agent-release:
    needs: [identity-groups, node-agent]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev-proxmox'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-agent-${{ github.sha }}
          path: release
      - name: Publish verified node component
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="node-agent-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; assets are not overwritten."
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease \
              --title "Node inventory ${GITHUB_SHA}" \
              --notes "Read-only Proxmox inventory with pinned mTLS service. No guest changes. Manual deployment: docs/node-transport.md at this commit."
          fi
  identity-groups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install uv==0.9.8
      - run: uv sync --locked
      - run: npm ci
      - run: node tools/init-dev.mjs
      - run: docker compose up -d --wait
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run ruff check apps/api tests migrations tools/*.py
      - run: uv run ruff format --check apps/api tests migrations tools/*.py
      - run: uv run pytest -q
        env:
          LAB_RUN_INTEGRATION: '1'
      - run: uv run python tools/check-contract.py
      - run: npm run generate && git diff --exit-code -- packages/shared-types/src/schema.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: uv run python tools/run-e2e.py
      - run: node tools/validate-preparation.mjs
      - run: bash -n tools/install-vps-updater.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: |
            test-results/
            artifacts/
      - if: always()
        run: docker compose stop
  vps-images:
    needs: identity-groups
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev-vps'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image names
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "API_IMAGE=ghcr.io/${OWNER,,}/lab-manager-api:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${OWNER,,}/lab-manager-web:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build release images outside the VPS
        run: |
          docker build -f infra/docker/api.Dockerfile -t "$API_IMAGE" .
          docker build -f infra/docker/web.Dockerfile -t "$WEB_IMAGE" .
      - name: Verify constrained release stack
        run: python3 tools/smoke-vps.py --api-image "$API_IMAGE" --web-image "$WEB_IMAGE"
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish verified commit images
        run: |
          docker push "$API_IMAGE"
          docker push "$WEB_IMAGE"
          echo "API: \`$API_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Web: \`$WEB_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: docker logout ghcr.io
