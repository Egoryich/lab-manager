name: Lab Manager checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  identity-groups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install uv==0.9.8
      - run: uv sync --locked
      - run: npm ci
      - run: node tools/init-dev.mjs
      - run: docker compose up -d --wait
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run ruff check apps/api tests migrations tools/*.py
      - run: uv run ruff format --check apps/api tests migrations tools/*.py
      - run: uv run pytest -q
        env:
          LAB_RUN_INTEGRATION: '1'
      - run: uv run python tools/check-contract.py
      - run: npm run generate && git diff --exit-code -- packages/shared-types/src/schema.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: uv run python tools/run-e2e.py
      - run: node tools/validate-preparation.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: |
            test-results/
            artifacts/
      - if: always()
        run: docker compose stop
