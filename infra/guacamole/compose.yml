# Runs inside a dedicated infrastructure VM. Only its tailnet address is bound.
name: lab-manager-guacamole
services:
  guacd:
    image: guacamole/guacd@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
    restart: unless-stopped
    # The upstream image checks every five minutes, longer than our bounded
    # deployment wait. Keep the same probe but run it during startup.
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4822"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    networks:
      - gateway

  guacamole:
    image: guacamole/guacamole@sha256:f344085e618bb05e22b964b0208dbd06d3468275bac70206f93805245e067b40
    restart: unless-stopped
    depends_on:
      - guacd
    environment:
      GUACD_HOSTNAME: guacd
      WEBAPP_CONTEXT: guacamole
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: ${JSON_SECRET_KEY:?Generate a random 16-byte hex secret}
    ports:
      - "${GUAC_BIND_IP:?Set the infrastructure VM tailnet IPv4}:8080:8080"
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    networks:
      - gateway

networks:
  gateway:
    driver: bridge
